[package]
name = "cc_core"
version = "0.1.0"
edition = "2021"
description = "CuentaConmigo shared core: capture model, validation, flow, storage and server client"
license = "MIT"
publish = false

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = "=1.0.128"
sha2 = "=0.10.8"
thiserror = "=1.0.64"
