<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
  <title id="t">CuentaConmigo</title>
  <desc id="d">Red ciudadana y no partidaria para cuidar la democracia: personas conectadas que cierran el conteo con el telegrama de su mesa. Elecciones 2027.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7CB9E8"/>
      <stop offset="1" stop-color="#1D4F91"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7CB9E8"/>
      <stop offset="1" stop-color="#1D4F91"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0B2545" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0B2545" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Fondo: celeste a azul, colores nacionales, no partidarios -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Red ciudadana: nodos (personas) conectados, al fondo -->
  <g stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M90 560 L220 480 L330 540 L470 470 L600 560 L740 500 L870 580 L1010 520 L1130 590"/>
    <path d="M220 480 L330 420 L470 470 L540 380 L740 500"/>
    <path d="M1010 520 L1120 440 M1130 590 L1010 520"/>
    <path d="M60 120 L160 70 L300 110 M160 70 L190 160"/>
    <path d="M1040 70 L1150 120 L1090 200 M1150 120 L1180 60"/>
    <path d="M330 540 L380 600 M600 560 L640 620 M870 580 L900 625"/>
  </g>
  <g fill="#FFFFFF" fill-opacity="0.85">
    <!-- cada nodo es una persona: cabeza + cuerpo -->
    <g transform="translate(220 480)"><circle cy="-11" r="5"/><rect x="-4" y="-3" width="8" height="20" rx="4"/></g>
    <g transform="translate(330 540)"><circle cy="-11" r="5"/><rect x="-4" y="-3" width="8" height="20" rx="4"/></g>
    <g transform="translate(330 420)"><circle cy="-11" r="5"/><rect x="-4" y="-3" width="8" height="20" rx="4"/></g>
    <g transform="translate(470 470)"><circle cy="-11" r="5"/><rect x="-4" y="-3" width="8" height="20" rx="4"/></g>
    <g transform="translate(540 380)"><circle cy="-11" r="5"/><rect x="-4" y="-3" width="8" height="20" rx="4"/></g>
    <g transform="translate(600 560)"><circle cy="-11" r="5"/><rect x="-4" y="-3" width="8" height="20" rx="4"/></g>
    <g transform="translate(740 500)"><circle cy="-11" r="5"/><rect x="-4" y="-3" width="8" height="20" rx="4"/></g>
    <g transform="translate(870 580)"><circle cy="-11" r="5"/><rect x="-4" y="-3" width="8" height="20" rx="4"/></g>
    <g transform="translate(1010 520)"><circle cy="-11" r="5"/><rect x="-4" y="-3" width="8" height="20" rx="4"/></g>
    <g transform="translate(1120 440)"><circle cy="-11" r="5"/><rect x="-4" y="-3" width="8" height="20" rx="4"/></g>
    <g transform="translate(160 70)"><circle cy="-11" r="5"/><rect x="-4" y="-3" width="8" height="20" rx="4"/></g>
    <g transform="translate(300 110)"><circle cy="-11" r="5"/><rect x="-4" y="-3" width="8" height="20" rx="4"/></g>
    <g transform="translate(1150 120)"><circle cy="-11" r="5"/><rect x="-4" y="-3" width="8" height="20" rx="4"/></g>
    <g transform="translate(1040 70)"><circle cy="-11" r="5"/><rect x="-4" y="-3" width="8" height="20" rx="4"/></g>
    <circle cx="90" cy="560" r="5"/><circle cx="60" cy="120" r="5"/><circle cx="1090" cy="200" r="5"/>
    <circle cx="1130" cy="590" r="5"/><circle cx="1180" cy="60" r="5"/><circle cx="190" cy="160" r="5"/>
  </g>

  <!-- Ícono de la app: cuatro palotes-personas y la quinta marca dorada -->
  <g transform="translate(80 150)" filter="url(#shadow)">
    <rect width="300" height="300" rx="66" fill="url(#tile)"/>
    <g transform="scale(0.29296875)">
      <g fill="#FFFFFF">
        <rect x="306" y="392" width="76" height="380" rx="38"/><circle cx="344" cy="318" r="46"/>
        <rect x="426" y="392" width="76" height="380" rx="38"/><circle cx="464" cy="318" r="46"/>
        <rect x="546" y="392" width="76" height="380" rx="38"/><circle cx="584" cy="318" r="46"/>
        <rect x="666" y="392" width="76" height="380" rx="38"/><circle cx="704" cy="318" r="46"/>
      </g>
      <line x1="262" y1="712" x2="786" y2="452" stroke="#F6B40E" stroke-width="84" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Texto -->
  <g font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" fill="#FFFFFF">
    <text x="430" y="248" font-size="86" font-weight="800" letter-spacing="-2">CuentaConmigo</text>
    <text x="432" y="306" font-size="33" font-weight="500">Potenciamos tu voz en las redes</text>
    <text x="432" y="348" font-size="33" font-weight="500">y fortalecemos la democracia.</text>
    <g transform="translate(432 384)">
      <rect width="446" height="40" rx="20" fill="#0B2545" fill-opacity="0.35" stroke="#FFFFFF" stroke-opacity="0.45"/>
      <text x="223" y="27" font-size="20" font-weight="600" text-anchor="middle" letter-spacing="0.5">Elecciones 2027 · ciudadana · no partidaria</text>
    </g>
  </g>

  <!-- Línea de cierre: de la red al telegrama -->
  <path d="M740 500 C 800 470, 860 470, 905 452" stroke="#F6B40E" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round" fill="none"/>

  <!-- Telegrama / certificado de escrutinio: el cierre de la auditoría -->
  <g transform="translate(900 410) rotate(-5)" filter="url(#soft)">
    <rect width="250" height="200" rx="14" fill="#FFFFFF"/>
    <rect x="0" y="0" width="250" height="34" rx="14" fill="#1D4F91"/>
    <rect x="0" y="20" width="250" height="14" fill="#1D4F91"/>
    <text x="16" y="23" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="1">TELEGRAMA · MESA 0000</text>
    <!-- filas: etiquetas abstractas (sin partidos reales) y cifras -->
    <g fill="#1D4F91" fill-opacity="0.22">
      <rect x="18" y="52" width="110" height="10" rx="5"/>
      <rect x="18" y="80" width="90" height="10" rx="5"/>
      <rect x="18" y="108" width="120" height="10" rx="5"/>
      <rect x="18" y="136" width="80" height="10" rx="5"/>
    </g>
    <g font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1D4F91" text-anchor="end">
      <text x="205" y="62">123</text>
      <text x="205" y="90">98</text>
      <text x="205" y="118">67</text>
      <text x="205" y="146">4</text>
    </g>
    <line x1="18" y1="160" x2="232" y2="160" stroke="#1D4F91" stroke-opacity="0.25" stroke-width="2"/>
    <text x="18" y="184" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#1D4F91" fill-opacity="0.7" letter-spacing="0.5">SHA-256 · 20:47 · verificado</text>
    <!-- sello: conteo cerrado, marca dorada -->
    <g transform="translate(216 172)">
      <circle r="24" fill="#F6B40E"/>
      <g stroke="#1D4F91" stroke-width="4" stroke-linecap="round">
        <line x1="-12" y1="-9" x2="-12" y2="9"/>
        <line x1="-4" y1="-9" x2="-4" y2="9"/>
        <line x1="4" y1="-9" x2="4" y2="9"/>
        <line x1="12" y1="-9" x2="12" y2="9"/>
      </g>
      <line x1="-16" y1="8" x2="16" y2="-8" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
